name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-22.04", "ubuntu-latest"]
        python-version: ["3.12", "3.13"]
        include:
          - os: "ubuntu-22.04"
            python-version: "3.12"
            pixi-environment: "cpu-py312"
          - os: "ubuntu-22.04"
            python-version: "3.13"
            pixi-environment: "cpu-py313"
          - os: "ubuntu-latest"
            python-version: "3.12"
            pixi-environment: "cpu-py312"
        exclude:
          - os: "ubuntu-latest"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v6

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.67.2
          cache: true
          environments: ${{ matrix.pixi-environment }}

      - name: Lint
        run: |
          pixi run -e ${{ matrix.pixi-environment }} lint

      - name: Type check
        run: |
          pixi run -e ${{ matrix.pixi-environment }} type-check

      - name: Run tests
        run: |
          pixi run -e ${{ matrix.pixi-environment }} test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
