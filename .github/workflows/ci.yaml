name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"

jobs:
  test:
    # Avoid running on latest with the non-base py313 env which includes the Orb feature, as
    # this avoids issues # with e.g. different gcc versions when building dm-tree from source
    # for Python 3.13.
    name: Test on ${{ matrix.runs-on }}, py${{ matrix.python-version }}, ${{ matrix.env-type }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on: ["ubuntu-22.04", "ubuntu-latest"]
        python-version: ["312", "313"]
        env-type: ["cpu", "base-cpu"]
        exclude:
          - runs-on: "ubuntu-latest"
            python-version: "313"
            env-type: "cpu"

    steps:
      - uses: actions/checkout@v6

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.67.2
          cache: true
          environments: ${{ matrix.env-type }}-py${{ matrix.python-version }}

      - name: Lint
        run: |
          pixi run -e ${{ matrix.env-type }}-py${{ matrix.python-version }} lint

      - name: Type check
        run: |
          pixi run -e ${{ matrix.env-type }}-py${{ matrix.python-version }} type-check

      - name: Run tests
        run: |
          pixi run -e ${{ matrix.env-type }}-py${{ matrix.python-version }} test

      - name: Upload coverage reports to Codecov
        # Only do this for one of the runs. Avoid the base envs as they skip a few MLP tests.
        if: matrix.runs-on == 'ubuntu-22.04' && matrix.env-type == 'cpu' && matrix.python-version == '313'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
